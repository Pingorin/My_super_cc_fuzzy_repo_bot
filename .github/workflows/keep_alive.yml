name: Keep Alive HF Space
on:
  schedule:
    - cron: "*/10 * * * *"  # Ye har 10 minute me jagayega
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Hugging Face Spaces (Ultimate Version)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # -L lagaya hai redirect follow karne ke liye, aur User-Agent lagaya hai taaki browser jaisa lage
          curl -L -H "Authorization: Bearer $HF_TOKEN" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://sona55-My_Fuzzy_c_bot.hf.space
          
          # Dusre bot ke liye (Naam update karna mat bhoolna)
          curl -L -H "Authorization: Bearer $HF_TOKEN" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" https://sona55-secound_bot.hf.space
