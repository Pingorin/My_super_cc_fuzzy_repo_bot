name: Keep Alive HF Space
on:
  schedule:
    - cron: "*/10 * * * *"  # Ye har 10 minute me jagayega
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Hugging Face Spaces
        run: |
          echo "Pinging Main Bot 1..."
          curl -i -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" https://sona55-my-fuzzy-c-bot.hf.space
          
          echo "Pinging Main Bot 2..."
          curl -i -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" https://sona55-my-fuzzy-c-22-bot.hf.space
