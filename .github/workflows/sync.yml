name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  # Ye line allow karti hai ki aap manual bhi sync chala sakein
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git push --force https://Sona55:$HF_TOKEN@huggingface.co/spaces/Sona55/My_Fuzzy_c_bot
